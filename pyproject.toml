[project]
name = "qart-ai"
version = "0.3.0"
description = "Qart.ai: evidence-based future-role matching and reskilling pathways for Malaysia (SDC Hackathon 2026, Domain 1)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "web", "data/raw"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes · I: import order · B: bugbear · UP: pyupgrade
# SIM: simplifications · N: pep8 naming (team standard, qart-code-standards skill)
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency pattern uses calls in defaults (Query(...), Depends(...)).
"src/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^web/", "^data/"]

[[tool.mypy.overrides]]
# Third-party packages without type hints.
module = ["runpod.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

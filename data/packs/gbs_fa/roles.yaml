# Roles in the GBS finance & accounting pack.
#
# Sources: TalentCorp (2024) GBS study. Impact levels: PDF p. 26. Career pathways for the highly
# impacted roles: PDF pp. 38–47 (printed 74–93), which name "possible roles for transition within
# the sector" and the skills that support them. Responsibility summaries are our own words.
#
# What is evidence and what is assumption:
#   evidence   – role names, impact levels, transitions and skill-to-role links (page given)
#   assumption – `core` skills of a destination role, chosen from its title and cluster;
#                required levels and weights per tier (src/params.py, ROLE_TIER_*)
#   crosswalk  – `soc` maps a role to the US SOC occupation the Economic Index reports on; a
#                declared, reviewed choice, not a fact from either source
#
# Tiers in `requires`: core (the role's defining work), upskill (named by TalentCorp for this
# destination), support (useful tools). `essential: true` marks requirements no scenario lowers.

current_roles:
  - id: financial_analyst
    title: Financial Analyst
    impact: high
    page: 38
    soc: "13-2051.00"
    summary: Financial analysis and forecasting, financial reports, support for business decisions and compliance.
    typical_skills: [financial_reporting, fpa, variance_analytics, erp, reporting]
    transitions: [finance_systems_analyst, budget_analyst]
    other_sectors: [Asset Investment Portfolio Engineer (Energy and Power), Market Research Senior Analyst (Wholesale and Retail Trade)]
  - id: ap_analyst
    title: Accounts Payable (AP) Analyst
    impact: high
    page: 39
    soc: "43-3031.00"
    summary: Processing invoices and expense reports, paying vendors on time, reconciling discrepancies.
    typical_skills: [invoice_processing, reconciliation, erp, vendor_management, accounting_principles]
    transitions: [cost_accountant, compliance_governance_specialist, fixed_assets_accountant]
    other_sectors: []
  - id: ar_analyst
    title: Accounts Receivable (AR) Analyst
    impact: high
    page: 39
    soc: "43-3031.00"
    summary: Collecting customer payments, issuing invoices, applying payments and following up overdue accounts.
    typical_skills: [credit_collections, cash_application, reconciliation, erp, stakeholder_management]
    transitions: [cost_accountant, fixed_assets_accountant]
    other_sectors: [Commercials & Billings Engineer (Energy and Power)]
  - id: invoice_processing_administrator
    title: Invoice Processing Administrator
    impact: high
    page: 40
    soc: "43-3021.00"
    summary: Entering, verifying and reconciling invoices and resolving discrepancies.
    typical_skills: [invoice_processing, reconciliation, data_validation, erp]
    transitions: [continuous_improvement_specialist, o2c_reporting_analyst]
    other_sectors: [Commercials & Billings Engineer (Energy and Power)]
  - id: vendor_master_data_administrator
    title: Vendor Master Data Administrator
    impact: high
    page: 41
    soc: "43-9021.00"
    summary: Maintaining accurate vendor records in finance systems and resolving data discrepancies.
    typical_skills: [data_management, data_validation, erp, vendor_management]
    transitions: [finance_systems_analyst, procurement_analyst]
    other_sectors: [Associate Database Support Engineer (ICT), Associate Data Centre Operations Engineer (ICT)]
  - id: payment_processing_analyst
    title: Payment Processing Analyst
    impact: high
    page: 42
    soc: "43-3031.00"
    summary: Executing payments on time, reconciling entries and keeping payment processes compliant and secure.
    typical_skills: [reconciliation, invoice_processing, internal_controls, erp]
    transitions: [p2p_reporting_analyst, compliance_governance_specialist]
    other_sectors: [Commercials & Billings Engineer (Energy and Power)]
  - id: order_management_analyst
    title: Order Management Analyst
    impact: high
    page: 43
    soc: "43-4151.00"
    summary: Entering and managing customer orders, coordinating fulfilment and resolving order issues.
    typical_skills: [erp, data_management, stakeholder_management, reporting]
    transitions: [finance_systems_analyst, o2c_reporting_analyst]
    other_sectors: [Logistics and Transportation Coordinator (Wholesale and Retail Trade), Sales Operations Assistant (Wholesale and Retail Trade)]
  - id: billing_analyst
    title: Billing Analyst
    impact: high
    page: 44
    soc: "43-3021.00"
    summary: Processing customer invoices, collecting payments, resolving billing discrepancies and analysing billing data.
    typical_skills: [invoice_processing, credit_collections, reporting, erp]
    transitions: [finance_systems_analyst, o2c_reporting_analyst]
    other_sectors: [Commercials & Billings Engineer (Energy and Power)]
  - id: credit_analyst
    title: Credit Analyst
    impact: high
    page: 45
    soc: "13-2041.00"
    summary: Assessing customer creditworthiness, setting and monitoring credit limits and managing credit risk.
    typical_skills: [credit_risk, financial_reporting, credit_collections, stakeholder_management]
    transitions: [finance_systems_analyst, o2c_reporting_analyst]
    other_sectors: [Commercials & Billings Engineer (Energy and Power), Market Research Senior Analyst (Wholesale and Retail Trade)]
  - id: cash_application_analyst
    title: Cash Application Analyst
    impact: high
    page: 46
    soc: "43-3031.00"
    summary: Applying incoming payments to customer accounts, reconciling cash receipts and keeping transaction records in the ERP.
    typical_skills: [cash_application, reconciliation, credit_collections, erp]
    transitions: [o2c_reporting_analyst, cost_accountant]
    other_sectors: [Associate Business Analyst (ICT), Commercials & Billings Engineer (Energy and Power)]
  - id: master_data_management_analyst
    title: Master Data Management Analyst
    impact: high
    page: 47
    soc: "15-2051.01"
    summary: Keeping master data accurate across systems through data governance and data quality checks.
    typical_skills: [data_management, data_validation, erp, stakeholder_management]
    transitions: [finance_systems_analyst]
    other_sectors: [Data Protection Executive (ICT), Associate Data Centre Operations Engineer (ICT)]


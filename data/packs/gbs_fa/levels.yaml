# Level descriptions (docs/PHASE2_PLAN.md §4 C1): a 0–5 scale and, per skill, five
# "I can…" sentences. The sentences are our own, written from the level structure of the
# cited frameworks; no framework text is copied (SFIA text is copyrighted). Each skill is
# `status: draft` until the team has reviewed its sentences. Levels are always a person's
# claim, never verified skill. `python -m src.levels --missing` lists required skills
# without a full set of sentences.
checked: '2026-10-30'
scale:
- level: 0
  label: none
  meaning: No exposure
- level: 1
  label: novice
  meaning: Understands the basics and can follow along
- level: 2
  label: aware
  meaning: Does routine tasks with guidance or a template
- level: 3
  label: working
  meaning: Handles the full task alone, including common problems
- level: 4
  label: proficient
  meaning: Handles complex cases, improves the process, guides others
- level: 5
  label: expert
  meaning: Sets standards or direction for a team, function or region
rules:
- 'Done, not studied: levels 3 and above need work experience; study alone counts as level 2 at most.'
- Pick the highest sentence that is true for your work in the last two years.
- Link a CV line where possible.

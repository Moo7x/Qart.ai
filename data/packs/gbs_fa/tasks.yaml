# Task crosswalk: which O*NET tasks show each skill a destination role needs (PLAN §4.3).
# Keyed by the role's O*NET-SOC occupation, then by pack skill id. The links of an occupation
# serve every destination role in that occupation.
# Task ids and wording are copied verbatim from the O*NET 31.0 Database (task_statements.csv),
# U.S. Department of Labor, Employment and Training Administration, CC BY 4.0. The links
# themselves are a declared mapping reviewed by the team (an assumption), not O*NET data.
# Only tasks of the role's own occupation are linked. A requirement with no fitting task here
# (for example the green skills, which O*NET 31.0 does not describe for these occupations)
# falls back to occupation-level evidence, and the screen says so.
source: O*NET 31.0 Database, task_statements.csv
source_url: https://www.onetcenter.org/database.html
licence: CC BY 4.0 (USDOL/ETA)
occupations:

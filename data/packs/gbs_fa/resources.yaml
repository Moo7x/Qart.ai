# Supplementary free resources shown next to the courses on My plan: YouTube videos and articles.
# They are linked, never copied, and they are NOT counted in the planned hours or the projected
# fit: only courses (courses.yaml) are, under the declared course rules.
# Every entry was checked on the date in `checked`:
#   videos   – title and channel from YouTube's public oEmbed endpoint
#              (https://www.youtube.com/oembed?url=...), length and upload date from the watch
#              page. Kept only from recognisable channels (professional bodies, universities,
#              the tool's makers, established educators); vendor sales videos were left out.
#   articles – the page loaded (HTTP 200 in code, or in a browser where the site blocks scripts)
#              and its title matched; publisher is the site owner.
# `skills` are pack skill ids. AI-basics topics (ai_basics) are a declared foundation that every
# person sees first; only `prompt_engineering` and `data_management` there are also pack skills.
checked: "2026-10-24"


# The roles the industry forecast covers (src/forecast/industry.py): every role TalentCorp (2024)
# lists in the GBS Finance & Accounting job cluster (PDF page 22; impact levels PDF page 26), plus
# the two destination roles of roles.yaml that TalentCorp names elsewhere in the study.
# `talentcorp` is the role's name exactly as stored in the `talentcorp_role_impact` series.
# `pack_role` links a role that roles.yaml already describes (its skills and requirements); roles
# without it are forecast at occupation level only and are not offered as a destination.
# `soc` is the O*NET occupation the role is measured through. For pack roles it is roles.yaml's;
# for the others it is our mapping (assumption), with the reason in `soc_reason`.
version: industry_roles/1
source: "TalentCorp (2024), Impact Study of AI, Digital and Green Economy on the Malaysian Workforce: GBS, PDF p. 22 and p. 26"

roles:
  - {id: financial_analyst, title: Financial Analyst, talentcorp: Financial Analyst, pack_role: financial_analyst, soc: "13-2051.00"}

# Field profile: Malaysian Global Business Services (GBS), finance & accounting.
# Lists the occupations the evidence layer follows for this field. Codes are US SOC / O*NET
# (O*NET 31.0, CC BY 4.0), the classification the Anthropic Economic Index uses.
# Role-level detail (TalentCorp roles, tasks, skills) lives in the other files of this pack.
# isco: the ISCO-08 unit group (the base of Malaysia's MASCO) reached through the official
# ESCO–O*NET crosswalk (ESCO Secretariat with USDOL/ETA, version 1, Sep 2022, O*NET-SOC 2019):
# the ESCO occupation named in `esco`, whose ESCO code starts with its ISCO-08 group (ESCO API,
# checked 2026-10-23). Rule: the exact match; where none has an ISCO code, the closest listed match
# whose ISCO-08 title names the same work, labelled by `esco_match`. Order Clerks has no usable
# match (only order picker and office clerk) and stays without one.
id: gbs_fa
name: GBS finance & accounting
country: MYS
soc_occupations:

# Practice tasks (docs/PHASE2_PLAN.md §8 B4): what to do at work to move a skill from
# level 2 to 3 ("working") and from 3 to 4 ("proficient"). Study reaches level 2 at
# most; these levels come from work done. Tasks are suggestions to agree with a manager,
# not courses. Weeks are declared estimates, the same for every skill (2→3: 8–16, about
# one to two quarters of doing the full task alone; 3→4: 26–52, about a half to a full
# year of complex cases), not measured durations. `show_by` is what the person describes
# in a progress check. Each task is `status: draft` until the team has reviewed it; its
# basis is the skill's level frameworks (levels.yaml).
checked: '2026-10-30'
